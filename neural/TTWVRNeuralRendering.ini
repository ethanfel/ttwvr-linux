[layer]
enabled=1
[capture]
enabled=1
first_stereo_frame=0
burst_frames=2
inspect_bindings=0
capture_candidates=0
scene_inputs=0
; Capture-only motion diagnostics. Processing enables the adapter as needed.
native_motion_probe=0
[neural_rendering]
enabled=0
; Select spatial (reset every frame) or experimental temporal NR.
experimental_spatial=0
experimental_temporal=0
; Start with identity to verify transport before evaluating NR.
transport_identity=1
; NR-only model grid: color/depth/motion scale together, full-resolution output.
; Settings apply live at a stereo frame boundary. Models A and B are selectable.
resolution_percent=100
model=B
intensity_percent=50
tone_percent=100
detail_percent=100
[diagnostics]
; Experimental opaque Vulkan GPU handoff. Matching layer/helper; restart required.
gpu_handoff=0
; Average OpenXR wait/application/end CPU spans, not GPU execution time.
frame_timing=0
; Optional sampled GPU timings around NGX, excluding conversions and transport.
gpu_timing=0
[dlaa]
; Diagnostic only: jitter without DLAA, leave disabled.
jitter_probe=0
; Independent native-resolution DLAA. Feature changes rebuild on bypass.
enabled=0

[super_resolution]
; DLSS scene -> 2944x2208 per eye, preset K for all three modes.
; Quality 1963x1472, Balanced 1708x1281, Performance 1472x1104.
; Selects its own AA; exclusive with NR and DLAA in this implementation.
enabled=0
mode=Quality
; Diagnostic only; forces lower scene rendering without neural reconstruction.
capture_probe=0
[frame_generation]
; Experimental queued stereo 2x. Requires separately supplied nvngx_dlssg.dll.
; Automatically uses opaque GPU handoff while enabled. Independent of SR.
enabled=0
